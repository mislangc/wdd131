<!DOCTYPE html>

    <link rel="stylesheet" href="styles/index.css">

<body>
    <header>
        <h1>Gamers Alley</h1>
        <nav>

            <a href="discover.html">Discover</a>

        <div class="ham-button">

        <div id="hero-images">

                <picture>
                    <source media="(min-width: 800px)" srcset="images/world-of-warcraft-large.webp">

                <p>World of Warcraft</p>

            <div id="hero-image-two" class="hero-image">

        <section>

            <div class=" horizontal-scroll" id="popular-games">

        <section>
